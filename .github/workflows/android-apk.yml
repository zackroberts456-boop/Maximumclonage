name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.1
  ANDROID_HOME: ${{ github.workspace }}/.android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
  PROJECT_DIR: ${{ github.workspace }}/.runtime-project

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract runtime project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"
          unzip -q MaximumClonage_Runtime_Project.zip -d "$PROJECT_DIR"
          test -f "$PROJECT_DIR/project.godot"
          test -f "$PROJECT_DIR/export_presets.cfg"

      - name: Apply master-project overrides
        shell: bash
        run: |
          set -euo pipefail
          if [ -d runtime_overrides ]; then
            rsync -a runtime_overrides/ "$PROJECT_DIR"/
          fi

          # Single-file base64 assets.
          if [ -d runtime_assets_b64 ]; then
            while IFS= read -r encoded; do
              rel="${encoded#runtime_assets_b64/}"
              out="$PROJECT_DIR/${rel%.b64}"
              mkdir -p "$(dirname "$out")"
              base64 --decode "$encoded" > "$out"
            done < <(find runtime_assets_b64 -type f -name '*.b64' -print | sort)
          fi

          # Large production binaries are stored as small text chunks so they can be
          # reviewed/transported safely by the connected development tooling.
          if [ -d runtime_asset_parts ]; then
            while IFS= read -r first_part; do
              rel="${first_part#runtime_asset_parts/}"
              encoded_rel="${rel%.part00}"
              out="$PROJECT_DIR/${encoded_rel%.b64}"
              prefix="${first_part%.part00}"
              mkdir -p "$(dirname "$out")"
              cat "${prefix}".part* | base64 --decode > "$out"
            done < <(find runtime_asset_parts -type f -name '*.part00' -print | sort)
          fi

          # Guard every production binary against silent truncation/corruption before
          # Godot ever sees it. A bad transfer fails immediately at this step.
          echo "558d17745c5302a3396265fc9eaaa1e576c7fe80edeffc715e3e3084723acdc8  $PROJECT_DIR/assets/bosses/killing_floor_rotor.png" | sha256sum -c -
          echo "c4a8b348cf827a7e05ebdcb9c4d6b4887f587c28c784d0ffa6076ed3473e72c9  $PROJECT_DIR/assets/environment/lab_environment_prod_v2.png" | sha256sum -c -
          echo "eea2681df34d7e8459a0e2bc8010949b260c64a073dfe343dee9bc40e818b996  $PROJECT_DIR/assets/environment/lab_tiles_prod_16.png" | sha256sum -c -
          echo "7a74443a5a9e85c93fbf793c788c933693769bd2bd608d7bfbd2963e0e528b58  $PROJECT_DIR/assets/enemies/clone_grunt_production.png" | sha256sum -c -
          echo "84efb0f58c438e1b0051dfd5e0b81ce33146b7fa066cb7b5849631b3a4b36986  $PROJECT_DIR/assets/enemies/acid_spitter_production.png" | sha256sum -c -

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot 4.7.1 and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          release_url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 -o /tmp/godot.zip \
            "$release_url/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 -o /tmp/godot-templates.tpz \
            "$release_url/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          rm -rf /tmp/godot /tmp/godot-templates
          mkdir -p /tmp/godot /tmp/godot-templates
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 \
            "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            /usr/local/bin/godot
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$template_dir/"
          test "$(godot --version | cut -d. -f1-3)" = "$GODOT_VERSION"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools" /tmp/android-command-line-tools
          curl -fL --retry 3 -o /tmp/android-command-line-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          unzip -q /tmp/android-command-line-tools.zip -d /tmp/android-command-line-tools
          mv /tmp/android-command-line-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Android export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot/keystores"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -storepass android \
            -keystore "$HOME/.local/share/godot/keystores/debug.keystore" \
            -dname "CN=Android Debug,O=Android,C=US" -validity 10000
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/debug_keystore = "$HOME/.local/share/godot/keystores/debug.keystore"
          export/android/debug_keystore_pass = "android"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

          grep -q 'textures/vram_compression/import_etc2_astc=true' "$PROJECT_DIR/project.godot" || \
            sed -i '/textures\/canvas_textures\/default_texture_filter=0/a textures/vram_compression/import_etc2_astc=true' \
              "$PROJECT_DIR/project.godot"

      - name: Validate and smoke test extracted project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path.cwd()
          output = root / "assets/source_archive/player_originals"
          output.mkdir(parents=True, exist_ok=True)
          for name in ("nada", "bella", "andre", "lawrence", "vance", "zack"):
              packed = Image.open(root / f"assets/players/{name}_runtime_80frames_packed.png").convert("RGBA")
              strip = Image.new("RGBA", (224 * 80, 160))
              for frame in range(80):
                  x, y = (frame % 10) * 224, (frame // 10) * 160
                  strip.paste(packed.crop((x, y, x + 224, y + 160)), (frame * 224, 0))
              strip.save(output / f"{name}_runtime_80frames.png")
          PY

          python tools/validate_project.py
          rm -rf assets/source_archive
          godot --headless --editor --path . --quit
          GODOT_BIN=godot ./tools/run_godot_smoke.sh

      - name: Export and verify debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          mkdir -p builds/android
          godot --headless --path . --export-debug Android builds/android/MaximumClonage.apk
          test -s builds/android/MaximumClonage.apk
          unzip -tq builds/android/MaximumClonage.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            builds/android/MaximumClonage.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaximumClonage-Android
          path: ${{ env.PROJECT_DIR }}/builds/android/MaximumClonage.apk
          if-no-files-found: error
