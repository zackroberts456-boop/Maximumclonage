name: Build Maximum Clonage Genesis ROM

on:
  push:
    branches:
      - genesis-rom-build
    paths:
      - 'ci/sgdk_v04_zip/**'
      - 'ci/v05_transform.py'
      - 'ci/v06_transform.py'
      - 'ci/v07_transform.py'
      - 'ci/v06_profile_patch.py'
      - 'ci/blastem_smoke.sh'
      - '.github/workflows/genesis-rom.yml'
  workflow_dispatch:

jobs:
  build-rom:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble SGDK v0.4 source package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/sgdk
          cat \
            ci/sgdk_v04_zip/part00.b64 \
            ci/sgdk_v04_zip/part01.b64 \
            ci/sgdk_v04_zip/part02.b64 \
            ci/sgdk_v04_zip/part03.b64 \
            ci/sgdk_v04_zip/part04.b64 \
            ci/sgdk_v04_zip/part05.b64 \
            ci/sgdk_v04_zip/part06a.b64 \
            ci/sgdk_v04_zip/part06b.b64 \
            ci/sgdk_v04_zip/part06c.b64 \
            ci/sgdk_v04_zip/part06d.b64 \
            ci/sgdk_v04_zip/part06e.b64 \
            ci/sgdk_v04_zip/part06f.b64 \
            ci/sgdk_v04_zip/part07a.b64 \
            ci/sgdk_v04_zip/part07b.b64 \
            ci/sgdk_v04_zip/part07c0.b64 \
            ci/sgdk_v04_zip/part07c1.b64 \
            ci/sgdk_v04_zip/part07c2.b64 \
            ci/sgdk_v04_zip/part07c3.b64 \
            ci/sgdk_v04_zip/part07d0.b64 \
            ci/sgdk_v04_zip/part07d1.b64 \
            ci/sgdk_v04_zip/part07d2.b64 \
            | tr -cd 'A-Za-z0-9+/=' | base64 --decode > build/source.zip
          echo '8e9f5cb0329b2f6a1effa8938d55ce8c64cf591330828aab1b0aff4dff9d2106  build/source.zip' | sha256sum -c -
          unzip -q build/source.zip -d build/sgdk
          chmod -R a+rwX build/sgdk

      - name: Transform source through v0.7
        shell: bash
        run: |
          set -euxo pipefail
          PROJECT_DIR="$(find build/sgdk -type f -name Makefile -printf '%h\n' | head -1)"
          test -n "$PROJECT_DIR"
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 ci/v05_transform.py "$PROJECT_DIR"
          python3 ci/v06_transform.py "$PROJECT_DIR"
          python3 ci/v07_transform.py "$PROJECT_DIR"
          grep -n 'v0.7' "$PROJECT_DIR/src/game.c" | head
          grep -n 'SPR_VRAM_REQUIRED\|sharedGrunt\|facility motifs' "$PROJECT_DIR/src/game.c" | head -20
          cat "$PROJECT_DIR/res/resources.res"

      - name: Build ROM with SGDK 2.11
        shell: bash
        run: |
          set -euxo pipefail
          PROJECT_DIR="$(find build/sgdk -type f -name Makefile -printf '%h\n' | head -1)"
          test -n "$PROJECT_DIR"
          chmod -R a+rwX "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          docker run --rm -v "$PWD:/m68k" -t registry.gitlab.com/doragasu/docker-sgdk:v2.11
          test -s out/rom.bin
          cp out/rom.bin "$GITHUB_WORKSPACE/Maximum_Clonage_Stage1_v0_7.bin"

      - name: Finalize Genesis header and checksum
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Maximum_Clonage_Stage1_v0_7.bin')
          b = bytearray(p.read_bytes())
          if len(b) < 0x200:
              raise SystemExit('ROM too small')

          def put(off, size, text):
              raw = text.encode('ascii')[:size].ljust(size, b' ')
              b[off:off+size] = raw

          put(0x110, 16, '(C)MAIDENHEAD26')
          put(0x120, 48, 'MAXIMUM CLONAGE - STAGE 1 V0.7')
          put(0x150, 48, 'MAXIMUM CLONAGE - STAGE 1 V0.7')
          put(0x180, 14, 'GM 00000000-00')

          data = bytes(b[0x200:])
          if len(data) & 1:
              data += b'\0'
          checksum = sum(int.from_bytes(data[i:i+2], 'big') for i in range(0, len(data), 2)) & 0xFFFF
          b[0x18E:0x190] = checksum.to_bytes(2, 'big')
          p.write_bytes(b)
          print(f'Patched Genesis checksum: 0x{checksum:04X}')
          PY

      - name: Verify Genesis ROM structure
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('Maximum_Clonage_Stage1_v0_7.bin')
          b = p.read_bytes()
          if len(b) < 0x200:
              raise SystemExit('ROM too small')
          if not b[0x100:0x110].startswith(b'SEGA'):
              raise SystemExit(f'Missing SEGA header: {b[0x100:0x110]!r}')
          title = b[0x150:0x180].decode('ascii','replace').rstrip()
          if title != 'MAXIMUM CLONAGE - STAGE 1 V0.7':
              raise SystemExit(f'Unexpected ROM title: {title!r}')
          stored = int.from_bytes(b[0x18E:0x190], 'big')
          data = b[0x200:]
          if len(data) & 1:
              data += b'\0'
          calc = sum(int.from_bytes(data[i:i+2], 'big') for i in range(0, len(data), 2)) & 0xFFFF
          print('ROM bytes:', len(b))
          print('SEGA header:', b[0x100:0x110])
          print('Domestic title:', b[0x120:0x150].decode('ascii','replace').rstrip())
          print('International title:', title)
          print(f'Header checksum: 0x{stored:04X}')
          print(f'Calculated checksum: 0x{calc:04X}')
          if stored != calc:
              raise SystemExit('Genesis checksum mismatch')
          print('SHA256:', hashlib.sha256(b).hexdigest())
          PY
          sha256sum Maximum_Clonage_Stage1_v0_7.bin > Maximum_Clonage_Stage1_v0_7.sha256

      - name: Build SGDK frame-load profiling ROM
        shell: bash
        run: |
          set -euxo pipefail
          PROJECT_DIR="$(find build/sgdk -type f -name Makefile -printf '%h\n' | head -1)"
          PROFILE_DIR="$GITHUB_WORKSPACE/build/profile-v07"
          python3 ci/v06_profile_patch.py "$PROJECT_DIR" "$PROFILE_DIR"
          chmod -R a+rwX "$PROFILE_DIR"
          cd "$PROFILE_DIR"
          rm -rf out src/boot res/resources.rs res/resources.d
          docker run --rm -v "$PWD:/m68k" -t registry.gitlab.com/doragasu/docker-sgdk:v2.11
          test -s out/rom.bin
          cp out/rom.bin "$GITHUB_WORKSPACE/Maximum_Clonage_Stage1_v0_7_PROFILE.bin"

      - name: BlastEm production smoke capture
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ci/blastem_smoke.sh
          ci/blastem_smoke.sh "$GITHUB_WORKSPACE/Maximum_Clonage_Stage1_v0_7.bin" "$GITHUB_WORKSPACE/qa-blastem"

      - name: BlastEm frame-load profiling capture
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ci/blastem_smoke.sh
          ci/blastem_smoke.sh "$GITHUB_WORKSPACE/Maximum_Clonage_Stage1_v0_7_PROFILE.bin" "$GITHUB_WORKSPACE/qa-blastem-profile"

      - name: Upload BlastEm QA captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maximum-clonage-v0-7-blastem-qa
          path: |
            qa-blastem/
            qa-blastem-profile/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload emulator-ready ROM
        uses: actions/upload-artifact@v4
        with:
          name: maximum-clonage-genesis-rom-v0-7
          path: |
            Maximum_Clonage_Stage1_v0_7.bin
            Maximum_Clonage_Stage1_v0_7.sha256
          if-no-files-found: error
          retention-days: 7
