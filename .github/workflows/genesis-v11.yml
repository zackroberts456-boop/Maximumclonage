name: Build Maximum Clonage Genesis v1.1

on:
  push:
    branches: [genesis-rom-build]
    paths:
      - 'ci/v11b_transform.py'
      - '.github/workflows/genesis-v11.yml'
  workflow_dispatch:

jobs:
  build-rom:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble source and apply v1.1 chain
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/sgdk
          cat \
            ci/sgdk_v04_zip/part00.b64 ci/sgdk_v04_zip/part01.b64 \
            ci/sgdk_v04_zip/part02.b64 ci/sgdk_v04_zip/part03.b64 \
            ci/sgdk_v04_zip/part04.b64 ci/sgdk_v04_zip/part05.b64 \
            ci/sgdk_v04_zip/part06a.b64 ci/sgdk_v04_zip/part06b.b64 \
            ci/sgdk_v04_zip/part06c.b64 ci/sgdk_v04_zip/part06d.b64 \
            ci/sgdk_v04_zip/part06e.b64 ci/sgdk_v04_zip/part06f.b64 \
            ci/sgdk_v04_zip/part07a.b64 ci/sgdk_v04_zip/part07b.b64 \
            ci/sgdk_v04_zip/part07c0.b64 ci/sgdk_v04_zip/part07c1.b64 \
            ci/sgdk_v04_zip/part07c2.b64 ci/sgdk_v04_zip/part07c3.b64 \
            ci/sgdk_v04_zip/part07d0.b64 ci/sgdk_v04_zip/part07d1.b64 \
            ci/sgdk_v04_zip/part07d2.b64 \
            | tr -cd 'A-Za-z0-9+/=' | base64 --decode > build/source.zip
          unzip -q build/source.zip -d build/sgdk
          PROJECT_DIR="$(find build/sgdk -type f -name Makefile -printf '%h\n' | head -1)"
          python3 -m pip install --disable-pip-version-check --quiet pillow
          for v in 05 06 07 08 09 10; do python3 "ci/v${v}_transform.py" "$PROJECT_DIR"; done
          python3 ci/v11b_transform.py "$PROJECT_DIR"
          chmod -R a+rwX "$PROJECT_DIR"
          echo "$PROJECT_DIR" > build/project_dir.txt
          grep -n 'v1.1\|SPR_SLOT_SPARK\|spawn_impact_pair\|render_camera_x' "$PROJECT_DIR/src/game.c" | head -50
          cat "$PROJECT_DIR/res/resources.res"

      - name: Build production ROM with SGDK 2.11
        shell: bash
        run: |
          set -euxo pipefail
          PROJECT_DIR="$(cat build/project_dir.txt)"
          cd "$PROJECT_DIR"
          docker run --rm -v "$PWD:/m68k" -t registry.gitlab.com/doragasu/docker-sgdk:v2.11
          test -s out/rom.bin
          cp out/rom.bin "$GITHUB_WORKSPACE/Maximum_Clonage_Stage1_v1_1.bin"

      - name: Finalize and verify Genesis header
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('Maximum_Clonage_Stage1_v1_1.bin')
          b=bytearray(p.read_bytes())
          def put(off,size,text): b[off:off+size]=text.encode('ascii')[:size].ljust(size,b' ')
          put(0x110,16,'(C)MAIDENHEAD26')
          put(0x120,48,'MAXIMUM CLONAGE - STAGE 1 V1.1')
          put(0x150,48,'MAXIMUM CLONAGE - STAGE 1 V1.1')
          put(0x180,14,'GM 00000000-00')
          data=bytes(b[0x200:]); data += b'\0' if len(data)&1 else b''
          c=sum(int.from_bytes(data[i:i+2],'big') for i in range(0,len(data),2))&0xffff
          b[0x18e:0x190]=c.to_bytes(2,'big'); p.write_bytes(b)
          bb=p.read_bytes(); stored=int.from_bytes(bb[0x18e:0x190],'big')
          data=bb[0x200:]; data += b'\0' if len(data)&1 else b''
          calc=sum(int.from_bytes(data[i:i+2],'big') for i in range(0,len(data),2))&0xffff
          assert bb[0x100:0x110].startswith(b'SEGA')
          assert bb[0x150:0x180].decode('ascii').rstrip()=='MAXIMUM CLONAGE - STAGE 1 V1.1'
          assert stored==calc
          print('ROM bytes:',len(bb)); print(f'Checksum: 0x{calc:04X}'); print('SHA256:',hashlib.sha256(bb).hexdigest())
          PY
          sha256sum Maximum_Clonage_Stage1_v1_1.bin > Maximum_Clonage_Stage1_v1_1.sha256

      - name: Upload verified ROM
        uses: actions/upload-artifact@v4
        with:
          name: maximum-clonage-genesis-rom-v1-1
          path: |
            Maximum_Clonage_Stage1_v1_1.bin
            Maximum_Clonage_Stage1_v1_1.sha256
          retention-days: 7

      - name: Build rolling-load profiler ROM
        shell: bash
        run: |
          set -euxo pipefail
          PROJECT_DIR="$(cat build/project_dir.txt)"
          PROFILE_DIR="$GITHUB_WORKSPACE/build/profile-v11"
          python3 ci/v06_profile_patch.py "$PROJECT_DIR" "$PROFILE_DIR"
          chmod -R a+rwX "$PROFILE_DIR"
          cd "$PROFILE_DIR"
          rm -rf out src/boot res/resources.rs res/resources.d
          docker run --rm -v "$PWD:/m68k" -t registry.gitlab.com/doragasu/docker-sgdk:v2.11
          test -s out/rom.bin
          cp out/rom.bin "$GITHUB_WORKSPACE/Maximum_Clonage_Stage1_v1_1_PROFILE.bin"

      - name: Package transformed source
        shell: bash
        run: |
          set -euxo pipefail
          PROJECT_DIR="$(cat build/project_dir.txt)"
          sudo chown -R "$(id -u):$(id -g)" "$PROJECT_DIR"
          rm -rf "$PROJECT_DIR/out" "$PROJECT_DIR/src/boot" "$PROJECT_DIR/res/resources.rs" "$PROJECT_DIR/res/resources.d"
          (cd "$(dirname "$PROJECT_DIR")" && zip -qr "$GITHUB_WORKSPACE/Maximum_Clonage_SGDK_Stage1_v1_1_Source.zip" "$(basename "$PROJECT_DIR")")

      - name: Upload source and profiler
        uses: actions/upload-artifact@v4
        with:
          name: maximum-clonage-genesis-dev-v1-1
          path: |
            Maximum_Clonage_SGDK_Stage1_v1_1_Source.zip
            Maximum_Clonage_Stage1_v1_1_PROFILE.bin
          retention-days: 7
